name: Rescore

# Any change to how a signal is built leaves every stored signal stale. This
# rebuilds them and re-runs the backtest, so nobody has to remember to.

on:
  push:
    branches: [main]
    paths:
      - 'src/signals/**'
      - 'src/db/purchases.py'
      - 'src/db/signals.py'
  workflow_dispatch:

concurrency:
  group: rescore
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Tests
        run: uv run pytest -q

      - name: Rebuild every stored signal
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/backfill_signals.py

      - name: Backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: uv run python scripts/run_backtest.py

      - name: Refresh dashboard cache
        if: success() && env.REVALIDATE_URL != ''
        continue-on-error: true
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            --max-time 30 || echo "Cache refresh failed; the 15-minute TTL will catch up."
