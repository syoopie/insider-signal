name: Daily Ingest

on:
  schedule:
    # 11:00 UTC = 6:00 AM ET (EST) / 7:00 AM ET (EDT)
    # Runs Monday–Friday only
    - cron: '0 11 * * 1-5'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt

      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_ingest.py

      - name: Refresh dashboard cache
        # The dashboard caches query results for 15 minutes. Without this it
        # would serve yesterday's signals for a quarter of an hour after the
        # ingest that produced today's. Never fails the run: the cache expires
        # on its own, so a missed bust is a delay, not an outage.
        if: success() && env.REVALIDATE_URL != ''
        continue-on-error: true
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            --max-time 30 || echo "Cache refresh failed; the 15-minute TTL will catch up."

      - name: Commit last_run.txt
        # Keeps repo active so GitHub doesn't disable scheduled workflows after 60 days
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --staged --quiet || git commit -m "chore: ingest run $(date -u +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
