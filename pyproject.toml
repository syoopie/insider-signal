[project]
name = "insider-signal"
version = "0.1.0"
description = "Scores SEC Form 4 insider purchases into buy signals; daily ingest + weekly backtest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tenacity>=8.2",
    # update_tickers.py only: pandas.read_html scrapes the S&P 500 / Russell
    # constituent tables, and read_html needs a parser (lxml).
    "pandas>=2.0,<3",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
# research/ only: the Form 4 archive is DuckDB over parquet. The scheduled
# workflows install with --no-default-groups and never import it.
research = [
    "duckdb>=1.5.5",
    "pyarrow>=17",
]

[tool.uv]
default-groups = ["dev", "research"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pyflakes only for now (real problems: unused names, undefined names, bad
# f-strings). The wider style ruleset is a separate cleanup.
select = ["F", "E9"]
